<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 8º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Cabeçalho do Boletim -->
    <header class="header">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">Estudante Exemplo • 8º Ano</p>
    </header>

    <!-- Área Superior com Cards de Resumo -->
    <section class="cards-container">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="media-geral" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="total-faltas" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="bom-desempenho" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="precisam-atencao" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="frequencia-geral" class="valor-card">92%</p>
        <span class="status-frequencia">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de Disciplinas -->
    <section class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <!-- As linhas das disciplinas serão inseridas dinamicamente pelo script.js -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
